<header>
  <div class="container">
    <sbb-transparent-button-link>
      <div class="logo-container" routerLink="/">
        <svg-icon src="icons/logo.svg" class="logo"></svg-icon>
        <div class="company text">
          <p class="company name">JÄGER FRITZ & URS</p>
          <p class="company subtext">FENSTERFABRIKATION & SCHREINEREI</p>
        </div>
      </div>
    </sbb-transparent-button-link>

    <div class="link-group">

      <div class="desktop-links">
        <sbb-header-link routerLink="/products" routerLinkActive="sbb-active">Produkte</sbb-header-link>
        <sbb-header-link routerLink="/about" routerLinkActive="sbb-active">Über uns</sbb-header-link>
        <sbb-header-link routerLink="/imprint" routerLinkActive="sbb-active">Kontakt</sbb-header-link>
      </div>

      <sbb-transparent-button id="jfu-navigation-menu-trigger">
        <div class="menu-button">
          <i class="bi bi-justify-right menu-icon"></i>
          <span>Menü</span>
        </div>
      </sbb-transparent-button>
    </div>
  </div>
</header>

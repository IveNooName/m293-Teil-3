<div class="year-element">
  <div class="year-display">
    <p class="year">{{ event().year }}</p>

    <div class="vr"></div>
  </div>

  <div class="main">
    <div class="header">
      <h4>{{ event().title }}</h4>
    </div>

    @for (d of event().description; track d) {
      <p>{{ d }}</p>
    }
  </div>
</div>
